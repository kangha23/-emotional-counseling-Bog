<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JinXuan - Trợ Lý Tư Vấn Tình Cảm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" id="bgDecor"></div>

  <div class="chat-container">
    <header class="chat-header">
      <button type="button" class="icon-btn" id="sidebarToggle" title="Lịch sử hội thoại">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="bot-avatar" id="headerAvatar">💗</div>
      <div class="bot-info">
        <h1>JinXuan</h1>
        <p><span class="status-dot"></span><span id="botTagline">Trực tuyến · Luôn sẵn sàng lắng nghe</span></p>
      </div>
      <div class="persona-picker" id="personaPicker">
        <button type="button" class="persona-btn" id="personaBtn" title="Chọn nhân vật tư vấn">
          <span id="personaBtnLabel">🩺 Chuyên gia</span>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="persona-menu" id="personaMenu"></div>
      </div>
      <button type="button" class="icon-btn" id="themeToggle" title="Chế độ tối">🌙</button>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2>Hội thoại</h2>
        <button type="button" class="new-chat-btn" id="newChatBtn">＋ Mới</button>
      </div>
      <div class="mood-panel">
        <div class="mood-panel-head">
          <h2>Nhật ký tâm trạng</h2>
          <div class="mood-tabs">
            <button type="button" class="mood-tab active" data-range="week">Tuần</button>
            <button type="button" class="mood-tab" data-range="month">Tháng</button>
          </div>
        </div>
        <div class="mood-chart" id="moodChart"></div>
        <button type="button" class="summary-btn" id="weeklySummaryBtn">📊 Tổng kết tuần cùng JinXuan</button>
      </div>
      <ul class="conv-list" id="convList"></ul>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="chat-box" id="chatBox"></main>

    <div class="suggestions" id="suggestions">
      <button class="chip">Crush không rep tin nhắn, nên làm gì? 💬</button>
      <button class="chip">Làm sao để tỏ tình tự nhiên? 🌹</button>
      <button class="chip">Mình và người yêu hay cãi nhau... 😔</button>
      <button class="chip">Làm quen người mới ở đâu? ✨</button>
    </div>

    <form class="input-area" id="chatForm">
      <button type="button" class="tool-btn" id="micBtn" title="Nói với JinXuan">🎤</button>
      <button type="button" class="tool-btn" id="ttsBtn" title="Đọc phản hồi bằng giọng nói">🔇</button>
      <input type="text" id="messageInput" placeholder="Tâm sự với JinXuan nhé..." autocomplete="off" />
      <button type="submit" class="send-btn" title="Gửi">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
